name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  build-vite:
    name: Build frontend (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: vite/yarn.lock
      - name: Install tree lib
        run: cd tree && yarn install --ignore-engines
      - name: Build tree lib
        run: cd tree && yarn compile
      - name: Install Vite deps
        run: cd vite && yarn --frozen-lockfile --ignore-engines
      - name: Build Vite
        run: cd vite && yarn build
      - name: Upload vite artifact
        uses: actions/upload-artifact@v4
        with:
          name: vite-dist
          path: vite/dist
          retention-days: 1

  release:
    name: Package ${{ matrix.os }}
    needs: build-vite
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # macOS signing (set these repo secrets once you have an Apple Developer cert)
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      APPLEID: ${{ secrets.APPLEID }}
      APPLEIDPASS: ${{ secrets.APPLEIDPASS }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Windows signing
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install server deps
        run: cd server && yarn --frozen-lockfile --ignore-engines
      - name: Compile server TS
        run: cd server && yarn build-ts
      - name: Download Vite artifact into server/build
        uses: actions/download-artifact@v4
        with:
          name: vite-dist
          path: server/build
      - name: Build & publish installer
        run: cd server && npx electron-builder --publish always
