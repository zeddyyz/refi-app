name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  verify-version:
    name: Verify tag matches server/package.json version
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches server/package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./server/package.json').version")
          echo "Tag version:        $TAG"
          echo "server/package.json: $PKG_VERSION"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match server/package.json version $PKG_VERSION. Bump server/package.json before tagging."
            exit 1
          fi

  build-vite:
    name: Build frontend (Vite)
    needs: verify-version
    if: always() && (needs.verify-version.result == 'success' || needs.verify-version.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: vite/yarn.lock
      - name: Install tree lib
        run: cd tree && npm install --legacy-peer-deps && npm install --legacy-peer-deps --no-save @types/minimatch@5
      - name: Build tree lib
        run: cd tree && npm run compile
      - name: Install Vite deps
        run: cd vite && yarn --frozen-lockfile --ignore-engines
      - name: Build Vite
        run: cd vite && yarn build
      - name: Upload vite artifact
        uses: actions/upload-artifact@v4
        with:
          name: vite-dist
          path: vite/dist
          retention-days: 1

  release:
    name: Package macOS (arm64)
    needs: build-vite
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install server deps
        run: cd server && yarn --frozen-lockfile --ignore-engines
      - name: Compile server TS
        run: cd server && yarn build-ts
      - name: Download Vite artifact into server/build
        uses: actions/download-artifact@v4
        with:
          name: vite-dist
          path: server/build
      - name: Build, sign, notarize & publish installer
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: cd server && npx electron-builder --mac --arm64 --publish always
