name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}

jobs:
  build-vite:
    name: Build frontend (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: vite/yarn.lock
      - name: Install tree lib
        run: cd tree && npm install --legacy-peer-deps && npm install --legacy-peer-deps --no-save @types/minimatch@5
      - name: Build tree lib
        run: cd tree && npm run compile
      - name: Install Vite deps
        run: cd vite && yarn --frozen-lockfile --ignore-engines
      - name: Build Vite
        run: cd vite && yarn build
      - name: Upload vite artifact
        uses: actions/upload-artifact@v4
        with:
          name: vite-dist
          path: vite/dist
          retention-days: 1

  release:
    name: Package macOS (arm64)
    needs: build-vite
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install server deps
        run: cd server && yarn --frozen-lockfile --ignore-engines
      - name: Compile server TS
        run: cd server && yarn build-ts
      - name: Download Vite artifact into server/build
        uses: actions/download-artifact@v4
        with:
          name: vite-dist
          path: server/build
      - name: Build & publish installer
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # Skip code signing when no cert is configured; avoids electron-builder's
          # empty-CSC_LINK bug where it resolves "" to cwd and errors with "not a file".
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: cd server && npx electron-builder --mac --arm64 --publish always
